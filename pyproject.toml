[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt"
version = "0.2.0"
description = "Personal, local job search: finds jobs that fit your resume, scores them, vets the companies, lists them in one HTML page. Driven by any coding agent — no LLM API or paid job API needed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["job-search", "jobs", "resume", "ats", "greenhouse", "lever", "coding-agent", "claude-code", "codex"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
]
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pandas>=2.1,<3",
  "python-jobspy>=1.5.0,<2",
  "rapidfuzz>=3.9",
  "pypdf>=4.2",
  "feedparser>=6.0",
  "python-dotenv>=1.0",
  "tenacity>=8.3",
  "beautifulsoup4>=4.12",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3.14", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
jobhunt = "jobhunt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobhunt = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real internet (run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP017"]
