# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
#  JobHunt resume — FACTS about you, used to score every job.  (What you want goes in preferences.yaml.)
#
#  EXAMPLE for a fictional person. `jobhunt init` copies it to profile/resume.yaml — replace everything there.
#  Easiest: ask your coding agent to draft this from your real resume (playbooks/setup.md), then review it.
#
#  Rules that make scoring honest:
#   • Only write what is true and you could defend in an interview. A requirement with no evidence here is "unmet".
#   • skills.level: hands_on (used for real work), working (used, would need ramp-up), exposure (courses/tinkering)
#   • bullet.evidence: implemented (you built it) | contributed (team effort) | explored (prototype / study)
#   • ids are optional — they are generated (EXP_ACME_ANALYTICS.B1 …). Give an `id:` if two entries clash.
#   • bullet.skills must be names (or aliases) from `skills`.
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
